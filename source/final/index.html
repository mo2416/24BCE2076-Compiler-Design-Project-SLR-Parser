<style>
:root{color-scheme:light;--gold:#b86e00;--desk:#ececec;--paper:#fff;--print:#1d1d1d;--muted:#6b6b6b;--rule:#c9c9c9;--ink:#222222;--red:#c62d2d;--teal:#111111;--teal-d:#111111;--teal-w:#f0f0f0;--ok:#2f8a4a;
  --on-teal:#fff;--head:#f4f4f4;--shadow:#c4c0b8;--good-bg:#e9f5ec;--bad-bg:#fbe9e9;--good-box:#f2faf4;--bad-box:#fdf3f3;--line:#eee;--warn:#9a5b00;--bar:#111111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--gold:#ffb020;--desk:#121212;--paper:#1d1d1f;--print:#e8e8e8;--muted:#a3a3a3;--rule:#46464a;--ink:#f2f2f2;--red:#ff7070;--teal:#e8e8e8;--teal-d:#f2f2f2;--teal-w:#2c2c30;--ok:#5fcf7f;
  --on-teal:#111;--head:#28282b;--shadow:#000;--good-bg:#173a22;--bad-bg:#43191b;--good-box:#152a1c;--bad-box:#311719;--line:#2e2e32;--warn:#e7a948;--bar:#000}}
:root[data-theme="dark"]{color-scheme:dark;--gold:#ffb020;--desk:#121212;--paper:#1d1d1f;--print:#e8e8e8;--muted:#a3a3a3;--rule:#46464a;--ink:#f2f2f2;--red:#ff7070;--teal:#e8e8e8;--teal-d:#f2f2f2;--teal-w:#2c2c30;--ok:#5fcf7f;
  --on-teal:#111;--head:#28282b;--shadow:#000;--good-bg:#173a22;--bad-bg:#43191b;--good-box:#152a1c;--bad-box:#311719;--line:#2e2e32;--warn:#e7a948;--bar:#000}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--desk);color:var(--print);font:15px/1.55 "Lora",Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--bar);color:#e3eef0;font:600 14px system-ui,sans-serif}
.bar b{font-size:16px;margin-right:6px}
.bar .sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:7px;padding:2px}
.seg button{border:0;background:none;color:#cfe3e5;padding:6px 14px;border-radius:6px}
.seg button.on{background:#fff;color:#111}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:0;background:var(--paper);color:var(--print);border-radius:6px;padding:7px 14px;font:600 14px system-ui,sans-serif}
.btn.pri{background:var(--teal);color:var(--on-teal)}
.bar .btn{background:#fff;color:#111}
.bar .btn.pri{background:#fff;color:#111}
.btn:disabled{opacity:.4;cursor:default}
.cnt{min-width:120px;text-align:center;color:#cfe3e5;font-weight:400}
.sheet{width:min(920px,96vw);margin:22px auto 30px;background:var(--paper);box-shadow:0 2px 0 var(--shadow),0 20px 40px -20px rgba(0,0,0,.45);padding:40px 56px 56px;position:relative}
/* grammar input card */
.inputs{width:min(920px,96vw);margin:22px auto 0;background:var(--paper);border-top:4px solid var(--teal);box-shadow:0 2px 0 var(--shadow);padding:22px 30px 24px}
.inputs h2{margin:0 0 4px;font:700 18px "Lora"}.inputs>p{margin:0 0 14px;color:var(--muted);font-size:14px}
.inputs.collapsed #editor{display:none}
.summary{display:none;font:15px "Cousine";color:var(--print)}
.inputs.collapsed .summary{display:block}
.pe-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.pe-label{display:block;font:600 13px system-ui,sans-serif;color:var(--muted);margin-bottom:4px}
.pe-stepper{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.pe-stepper button{width:34px;border:0;background:var(--teal-w);font-size:17px;color:var(--teal-d)}
.pe-stepper input{width:56px;background:transparent;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);text-align:center;font:600 16px "Cousine";-moz-appearance:textfield}
.pe-stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.pe-off{opacity:.35;pointer-events:none}
.pe-tools{display:flex;gap:8px}
.pe-tools select,.pe-mode{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif}
.pe-rows{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--rule)}
.pe-row{display:grid;grid-template-columns:44px 100px 30px minmax(0,1fr) 38px 34px;align-items:center;border-bottom:1px solid var(--rule);min-height:42px}
.pe-n{color:var(--muted);font:14px "Cousine"}
.pe-row input{border:0;background:none;font:17px "Cousine";padding:6px 4px;min-width:0}
.pe-row input:focus{outline:none;box-shadow:inset 0 -2px 0 var(--teal)}
.pe-lhs{font-weight:700!important}
.pe-arrow{text-align:center;color:var(--muted)}
.pe-eps,.pe-del{border:0;background:none;color:var(--muted);font-size:16px;height:32px;border-radius:4px}
.pe-eps:hover,.pe-del:hover:not(:disabled){background:var(--teal-w);color:var(--teal-d)}
.pe-del:disabled{opacity:.25}
.pe-note{grid-column:4/-1;margin:-6px 0 6px;font:13px system-ui,sans-serif;color:var(--muted)}
.pe-note-err{color:var(--red)}.pe-bad .pe-n{color:var(--red)}
.pe-text{width:100%;border:1px solid var(--rule);background:var(--paper);font:16px/1.6 "Cousine";padding:10px;margin-bottom:6px}
.pe-hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.pe-meta{display:grid;grid-template-columns:180px 1fr;gap:16px;margin-bottom:12px}
.pe-start{border:1px solid var(--rule);border-radius:6px;font:15px "Cousine";padding:4px 8px;background:var(--paper);min-width:80px}
.pe-syms>div{margin-bottom:4px}.pe-syms .pe-label{display:inline-block;width:110px;margin:0}
.pe-chip{font:15px "Cousine";margin-right:10px}.pe-nt{color:var(--teal-d);font-weight:700}
.pe-warn{font:13px system-ui,sans-serif;color:var(--warn);margin:4px 0 0}
.pe-input{margin-bottom:10px}
.pe-w{width:100%;border:0;border-bottom:2px solid var(--print);font:20px "Cousine";padding:6px 2px;background:none}
.pe-w:focus{outline:none;border-bottom-color:var(--teal)}
.pe-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pe-key{border:1px solid var(--rule);background:var(--paper);border-radius:6px;font:15px "Cousine";padding:3px 12px;min-height:34px}
.pe-key:hover{border-color:var(--teal)}
.pe-space{display:flex;gap:8px;align-items:center;font:13px system-ui,sans-serif;color:var(--muted);margin-bottom:12px}
.pe-error{color:var(--red);font:14px system-ui,sans-serif;border-left:3px solid var(--red);padding:4px 10px;margin:0 0 12px}
.pe-build{border:0;background:var(--teal);color:var(--on-teal);border-radius:6px;padding:10px 22px;font:600 15px system-ui,sans-serif}
/* worksheet */
.head{border-bottom:2px solid var(--print);padding-bottom:10px;margin-bottom:18px}
.head h1{font:700 22px/1.2 "Lora";margin:0}.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.head .g{font:15px "Cousine";color:var(--print)}
h2.q{font:700 17px "Lora";margin:26px 0 8px}h2.q small{font-weight:400;color:var(--muted);font-size:13.5px;margin-left:6px}
.qb{position:relative}
.prod{font:15px "Cousine";margin:2px 0}
.ink{font:700 23px/1 "Caveat",cursive;color:var(--ink)}
.write{display:inline-block;animation:write .7s steps(14) both;clip-path:inset(0 100% 0 0)}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.ask{display:inline-block;min-width:34px;text-align:center;border:2px dashed var(--teal);border-radius:4px;color:var(--teal);font:700 18px "Cousine";padding:0 6px;background:var(--paper)}
.blank{display:inline-block;min-width:90px;border-bottom:1px solid var(--print);min-height:24px;vertical-align:bottom;padding:0 4px}
table.w{border-collapse:collapse;margin:6px 0}
table.w th,table.w td{border:1px solid var(--print);padding:3px 10px;height:34px;text-align:left;vertical-align:middle}
table.w th{font:600 13.5px "Lora";background:var(--head)}
table.w.c td{text-align:center;padding:2px 4px;min-width:46px}
table.w td.conf .ink{color:var(--red)}
.scroll{overflow-x:auto}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{border:1px solid var(--print);min-height:96px;padding:4px 8px 6px}
.box b{font:700 14px "Lora"}
.box .ink{font-size:19px;line-height:1.15;display:block}
.trans{font:14px "Cousine";color:var(--muted);margin-top:6px}
.note{position:absolute;right:-210px;width:190px;font:600 19px/1.15 "Caveat";color:var(--red);transform:rotate(-2deg)}
.note::before{content:"";position:absolute;left:-26px;top:10px;width:22px;border-top:2px solid var(--red)}
.cur{background:var(--teal-w)}
.err{color:var(--red);font:15px system-ui,sans-serif}
/* practice bar */
.pbar{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:3px solid var(--teal);box-shadow:0 -8px 24px -12px rgba(0,0,0,.3);padding:14px 18px}
.pbar-in{width:min(920px,96vw);margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.pbar .qtext{font:600 16px "Lora"}.pbar .qtext small{display:block;font:13px system-ui,sans-serif;color:var(--muted)}
.pbar form{display:flex;gap:8px;align-items:center}
.pbar input{width:170px;border:0;border-bottom:2px solid var(--print);font:700 24px "Caveat";color:var(--ink);background:none;padding:2px 4px}
.pbar input:focus{outline:none;border-bottom-color:var(--teal)}
.fb{grid-column:1/3;font:15px system-ui,sans-serif;min-height:22px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--red)}
.fb .why{color:var(--muted)}
.tally{font:600 14px system-ui,sans-serif;color:#cfe3e5}
.pin{border:0;border-bottom:1.5px solid var(--rule);background:transparent;font:700 21px/1.2 "Caveat",cursive;color:var(--ink);padding:2px 4px;max-width:100%}
.pin:focus{outline:none;border-bottom-color:var(--teal)}
.pin.good{background:var(--good-bg);border-bottom-color:var(--ok)}.pin.wrong{background:var(--bad-bg);border-bottom-color:var(--red)}
.pta{width:100%;border:0;resize:vertical;font:700 19px/1.2 "Caveat",cursive;color:var(--ink);background:repeating-linear-gradient(transparent 0 22px,var(--line) 22px 23px);outline:none;margin-top:4px}
.box.good{border-color:var(--ok);background:var(--good-box)}.box.wrong{border-color:var(--red);background:var(--bad-box)}
.pctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn.line{border:1px solid var(--rule)}
.bar .btn.line{border-color:transparent}
.pmark{font:600 14px system-ui,sans-serif}.pmark.ok{color:var(--ok)}.pmark.todo{color:var(--muted)}.pmark.bad{color:var(--red)}
.pnotes{margin:8px 0 0;padding-left:20px;font:600 19px/1.2 "Caveat";color:var(--red)}
.pnotes li{margin-bottom:4px}
.ptotal{margin-top:24px;font:700 17px "Lora";border-top:2px solid var(--print);padding-top:10px}
/* test mode */
.clock{font:700 18px "Cousine";color:#fff;letter-spacing:.5px;min-width:92px;text-align:center}
.clock.paused{color:#9a9a9a}
.tsubmit{margin-top:30px;border-top:2px solid var(--print);padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tsubmit p{margin:0;color:var(--muted);font-size:14px;flex:1;min-width:220px}
.tresult{border:2px solid var(--print);padding:14px 18px;margin:0 0 20px}
.tresult h2{margin:0 0 6px;font:700 19px "Lora"}
.printonly{display:none}
.tresult .best{margin:10px 0 0;font-weight:600}
.tresult .best,.tresult .big.new{color:var(--gold)}
.tresult .best.new{font-size:17px}
.tresult .big{font:700 30px "Cousine";margin-right:22px}
.tresult table{border-collapse:collapse;margin-top:10px;font-size:14px}
.tresult td{padding:2px 14px 2px 0}
.pin[readonly],.pta[readonly]{cursor:not-allowed}
/* peek: a wrong answer's correct entry under spoiler specks (js/spoiler.js) */
.spoil{position:relative;display:inline-block;min-width:38px;padding:1px 6px;margin-left:6px;border-radius:3px;background:var(--teal-w);color:var(--print);font:13px/1.4 "Cousine";text-align:center;vertical-align:middle;cursor:pointer;white-space:nowrap}
.spoil:hover:not(.open){background:var(--rule)}
.spoil .spoil-t{opacity:0;filter:blur(6px);user-select:none;transition:opacity .45s cubic-bezier(.23,1,.32,1),filter .45s cubic-bezier(.23,1,.32,1)}
.spoil.open{cursor:default;background:none;color:var(--muted)}
.spoil.open .spoil-t{opacity:1;filter:none;user-select:auto}
.spoil-c{position:absolute;left:0;top:0;pointer-events:none}
td .spoil{display:block;margin:3px auto 0;width:max-content}
@media (prefers-reduced-motion:reduce){.spoil .spoil-t{transition:opacity .2s}}
.tbegin{border:2px dashed var(--teal);padding:14px 18px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tbegin p{margin:0;flex:1;min-width:220px;font-size:14px;color:var(--muted)}
@media (max-width:1300px){.note{position:static;display:block;width:auto;transform:none;margin:4px 0 0}.note::before{display:none}}
@media (max-width:700px){.sheet,.inputs{padding:22px 16px}.states{grid-template-columns:repeat(2,1fr)}.pe-row{grid-template-columns:34px 70px 22px minmax(0,1fr) 32px 30px}.pe-meta{grid-template-columns:1fr}.pbar-in{grid-template-columns:1fr}}
@media print{.bar,.inputs,.pbar,.noprint,.tsubmit button{display:none}.tresult{break-inside:avoid}.printonly{display:block}.solution{break-before:page}.solution .note{display:none}.write{animation:none;clip-path:none}body{background:#fff}.sheet{box-shadow:none;margin:0;width:auto}}
@media (prefers-reduced-motion:reduce){.write{animation:none;clip-path:none}}
</style></head>
<body>
<script>try{var t=localStorage.getItem('slr.theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<div class="bar"><b>SLR(1) Parser</b><div class="seg"><button type="button" class="on" data-mode="teach">Teach</button><button type="button" data-mode="practice">Practice</button><button type="button" data-mode="test">Test</button></div><button type="button" class="btn line" id="theme" aria-label="Switch light or dark theme" title="Light / dark"></button><span class="sp"></span><span id="ctl"></span></div>

<section class="inputs" id="inputs">
  <h2>Grammar and input</h2>
  <p>Fill one production per row (a new row appears as you type), then type the input string to parse (for example <span style="font-family:Cousine">aacb</span>). Or load an example.</p>
  <div class="summary" id="summary"></div>
  <div style="display:flex;gap:8px;margin:0 0 10px"><button type="button" class="btn line" id="clear">Clear grammar</button></div>
  <div id="editor"></div>
</section>

<main class="sheet" id="sheet"></main>
<div class="pbar" id="pbar" hidden><div class="pbar-in" id="pbar-in"></div></div>

<script src="../js/grammar.js"></script><script src="../js/slr.js"></script><script src="../js/examples.js"></script><script src="../js/practice.js"></script><script src="../js/core.js"></script><script src="../js/lesson.js"></script><script src="../js/rows.js"></script><script src="../js/spoiler.js"></script>
<script>
(function(){'use strict';
/* PEEK: after Check in Practice, each wrong answer gets its correct entry hidden
   under spoiler specks; click to peek. Set to false to go back to plain marking. */
var PEEK=true;
/* PARTIAL: in Practice, Check marks only what was entered; answers left empty are
   counted as "not filled yet" instead of wrong. Set to false to mark every cell. */
var PARTIAL=true;
/* TEACH_NAV: Teach mode gets "Play" (steps by itself) and "Next section" (skips to
   the next part of the worksheet). Set to false to keep only Back / Next step. */
var TEACH_NAV=true;
var $=function(q){return document.querySelector(q)},esc=Core.esc;
var s=null,STEPS=[],M={mode:'teach',k:0,score:0,tries:0,answered:{}};

/* ---------- build from the input card ---------- */
var editor=new ProductionEditor($('#editor'),{onBuild:build,dynamic:true});
function build(cfg){
  var r=Core.build(cfg);
  if(!r.ok){editor.showError(r.error);return}
  if(r.s.tokenError)editor.showError(r.s.tokenError+' The construction is still shown; fix the input to see the parse.');else editor.showError('');
  stopPlay();s=r.s;STEPS=Lesson.steps(s);M.k=0;M.score=0;M.answered={};PS.practice=freshP();PS.test=freshP();P=PS[M.mode]||PS.practice;
  $('#summary').innerHTML='<b>'+esc(s.g.productions.slice(1).map(function(p){return SLR.prodStr(p)}).join('   ·   '))+'</b><br>input: '+esc(s.tokens?s.tokens.join(' '):'(invalid)')+'  <button type="button" class="btn line" id="edit" style="margin-left:10px">Edit</button>';
  render();
}

/* ---------- worksheet at step k ----------
   teach: steps 0..k are written, step k in fresh ink.
   practice (ask): steps 0..k-1 are written, the place of step k shows "?". */
function local(stage,upto){var n=-1;for(var i=0;i<=upto;i++)if(STEPS[i].stage===stage)n++;return n}
function ink(t,fresh){return '<span class="ink'+(fresh?' write':'')+'">'+esc(t)+'</span>'}
var ASK='<span class="ask">?</span>';
function sheet(){
  var ask=M.mode==='practice'&&!M.answered[M.k],k=M.k,upto=ask?k-1:k,st=STEPS[k],fresh=function(stage){return !ask&&st.stage===stage};
  var note=function(stage){return !ask&&st.stage===stage?'<div class="note">'+esc(st.text)+'</div>':''};
  var h='<div class="head"><h1>SLR(1) parsing</h1><p class="g">'+esc(s.g.productions.slice(1).map(function(p){return SLR.prodStr(p)}).join('    '))+'</p></div>';
  /* Q1 */
  h+='<h2 class="q">1. Augmented grammar <small>productions numbered from 0</small></h2><div class="qb">'+Core.prods(s).map(function(p){return '<div class="prod">('+p.index+')  '+(p.index===0?(upto>=0?ink(p.text,fresh('grammar')):(ask&&st.stage==='grammar'?ASK:'')):esc(p.text))+'</div>'}).join('')+note('grammar')+'</div>';
  /* Q2 */
  var fi=local('ff',upto),v=Core.ff(s,fi),fcur=st.stage==='ff'?s.an.ff.steps[st.ref.i]:null;
  h+='<h2 class="q">2. FIRST and FOLLOW</h2><div class="qb"><table class="w"><tr><th></th><th>FIRST</th><th>FOLLOW</th></tr>'+v.rows.map(function(r){
    function cell(kind,list){var here=fcur&&fcur.kind===kind&&fcur.of===r.nt,txt=list.length?'{ '+list.map(function(x){return x.sym}).join(', ')+' }':'';
      return '<td style="min-width:210px" class="'+(here?'cur':'')+'">'+(txt?ink(txt,here&&!ask):'')+(here&&ask?' '+ASK:'')+'</td>'}
    return '<tr><th>'+esc(r.nt)+'</th>'+cell('FIRST',fi<0?[]:r.first)+cell('FOLLOW',fi<0?[]:r.follow)+'</tr>'}).join('')+'</table>'+note('ff')+'</div>';
  /* Q3 */
  var ii=local('items',upto),it=ii<0?null:Core.items(s,ii),icur=st.stage==='items'?s.an.lr0.steps[st.ref.i]:null;
  h+='<h2 class="q">3. Canonical collection of LR(0) items</h2><div class="qb"><div class="states">'+s.an.lr0.states.map(function(I){
    var shown=it&&it.states.has(I.id),here=icur&&icur.state===I.id,info=Core.stateInfo(s,I.id);
    var body=shown?info.items.map(function(l){return '<span class="ink'+(here&&!ask&&icur.type!=='existing'?' write':'')+'">'+esc(l.text)+'</span>'}).join(''):(here&&ask?'<div style="margin-top:8px">'+ASK+'</div>':'');
    return '<div class="box'+(here?' cur':'')+'"><b>I'+I.id+'</b>'+body+'</div>'}).join('')+'</div>'+
    (it?'<div class="trans">'+s.an.lr0.steps.slice(1,ii+1).map(function(x){return 'goto(I'+x.from+','+x.sym+')=I'+x.state}).join(' · ')+(icur&&ask&&icur.from!==null?' · goto(I'+icur.from+','+icur.sym+')=?':'')+'</div>':'')+note('items')+'</div>';
  /* Q4 */
  var ti=local('table',upto),t=Core.tableAt(s,ti),cols=t.terminals.concat(t.nonTerminals),tcur=st.stage==='table'?s.an.table.fills[st.ref.i]:null;

  var t=M.mode==='teach',n=STEPS.length;
  if(t)$('#ctl').innerHTML='<button class="btn" id="first" type="button">⏮</button> <button class="btn" id="prev" type="button">◀ Back</button> <span class="cnt">Step '+(M.k+1)+' of '+n+'</span> <button class="btn pri" id="next" type="button">Next step ▶</button>'+
    (TEACH_NAV?' <button class="btn" id="nextsec" type="button">Next section ⏭</button> <button class="btn" id="play" type="button">'+(playTimer?'⏸ Pause':'▶ Play')+'</button>':'');
  else if(TEST())$('#ctl').innerHTML='<span class="clock" id="clock" title="Time taken">'+fmt(P.submitted?P.time:elapsed())+'</span>'+(P.submitted?' <button class="btn" type="button" data-print>Print / Save as PDF</button>':'')+(P.begun&&!P.submitted?' <button class="btn" id="tpause" type="button">'+(P.t0?'Pause':'Resume')+'</button>':'')+(P.begun?' <button class="btn" id="tretake" type="button">Restart test</button>':'');
  else $('#ctl').innerHTML='<button class="btn" id="restart" type="button">Clear my answers</button>';
  if(t){$('#first').disabled=$('#prev').disabled=M.k===0;$('#next').disabled=M.k===n-1;if(TEACH_NAV)$('#nextsec').disabled=M.k===n-1}
  document.querySelectorAll('.seg button').forEach(function(x){var off=testActive()&&x.dataset.mode!=='test';x.disabled=off;x.title=off?'Locked until you submit the test':''});
  var y=scrollY;$('#sheet').innerHTML=t?sheet():practiceSheet();
  if(PEEK&&!t&&window.Spoiler)Spoiler.scan($('#sheet'),function(el){P.peeked[el.getAttribute('data-peek')]=true});$('#pbar').hidden=true;
  if(!t){scrollTo(0,y);return}
  var c=document.querySelector('.sheet .cur');if(c)c.scrollIntoView({block:'center',behavior:'smooth'});
}
/* ---------- teach: autoplay and next section ----------
   STEPS is the list of every construction step, and the worksheet shows steps 0..M.k.
   Play: a timer calls go(M.k+1), exactly what the Next button does, every PLAY_MS,
   and stops itself at the last step. Next section: move forward until the step's
   stage (ff, items, table, conflicts, parse) changes. */
var PLAY_MS=1200,playTimer=null;
function startPlay(){if(M.k>=STEPS.length-1)M.k=0;playTimer=setInterval(function(){if(M.k>=STEPS.length-1){stopPlay();render();return}go(M.k+1)},PLAY_MS);render()}
function stopPlay(){clearInterval(playTimer);playTimer=null}
function nextSection(){var k=M.k,stage=STEPS[k].stage;while(k<STEPS.length-1&&STEPS[k].stage===stage)k++;go(k)}
function go(k){M.k=Math.max(0,Math.min(STEPS.length-1,k));render()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){if(testActive()&&b.dataset.mode!=='test')return;stopPlay();M.mode=b.dataset.mode;P=PS[M.mode]||P;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b)});render();scrollTo(0,0);return}
  if(b.id==='next')go(M.k+1);
  if(b.id==='nextsec')nextSection();
  if(b.id==='play'){if(playTimer){stopPlay();render()}else startPlay()}if(b.id==='prev')go(M.k-1);if(b.id==='first')go(0);
  if(b.dataset.check){check(+b.dataset.check,false);render()}
  if(b.dataset.show){check(+b.dataset.show,true);render()}
  if(b.id==='addst'){P.nStates++;render()}if(b.id==='delst'){P.nStates--;render()}
  if(b.id==='addrow'){P.nRows++;render()}if(b.id==='delrow'){P.nRows--;render()}
  if(b.id==='clear'){editor.setCfg({grammar:'',input:'',spaceOnly:false});var f=document.querySelector('.pe-lhs');if(f)f.focus();return}
  if(b.id==='edit'){$('#inputs').classList.remove('collapsed');$('#inputs').scrollIntoView({behavior:'smooth'})}
  if(b.id==='pnext'){if(M.k===STEPS.length-1){$('#fb')&&($('#fb').innerHTML='Finished. Score '+M.score+' of '+STEPS.filter(function(x){return question(x)}).length+' (first-try answers).');return}M.answered[M.k]=true;go(M.k+1)}
  if(b.id==='show')answer('',true);
  if(b.id==='restart'){P.v={};P.res={};P.want={};P.peeked={};P.nStates=1;P.nRows=1;render()}
  if(b.id==='tsubmit')submitTest();
  if('print' in b.dataset)window.print();
  if(b.id==='tbegin'){P.begun=true;startClock();render();var fi=document.getElementById('p-aug');if(fi)fi.focus()}
  if(b.id==='tpause'){if(P.t0)pauseClock();else startClock();render()}
  if(b.id==='tretake'&&(P.submitted||confirm('Restart the test? Your answers and the stopwatch are cleared.'))){P=PS.test=freshP();render();scrollTo(0,0)}
  if(b.id==='theme'){var nx=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('slr.theme',nx)}catch(err){}themeIcon()}});
document.addEventListener('input',function(e){if(e.target.id&&e.target.id.indexOf('p-')===0){if(locked()){e.target.value=P.v[e.target.id]||'';return}P.v[e.target.id]=e.target.value;if(TEST()&&!P.t0&&!P.submitted){startClock();var tp=$('#tpause');if(tp)tp.textContent='Pause'}}});
document.addEventListener('submit',function(e){if(e.target.id==='pform'){e.preventDefault();answer($('#pans').value,false)}});
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||M.mode!=='teach'||!s)return;if(e.key==='ArrowRight')go(M.k+1);if(e.key==='ArrowLeft')go(M.k-1)});
var cfg=Core.initial();editor.setCfg(cfg);build(cfg);
})();
</script></body></html>
